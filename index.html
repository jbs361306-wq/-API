<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 미세먼지 경보 대시보드</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container-main {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-in;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #667eea;
            margin: 10px 0;
        }

        .stat-label {
            color: #666;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .main-chart {
            grid-column: 1/-1;
        }

        .sub-charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            grid-column: 1/-1;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-height: 500px;
        }

        .chart-card.main-top10 {
            min-height: 600px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            border: 2px solid #667eea;
        }

        .chart-card h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .chart-card.main-top10 h3 {
            color: #667eea;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .error-alert {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #f5c6cb;
            margin-bottom: 20px;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .table tbody tr:hover {
            background-color: #f8f9fa;
            transition: all 0.3s ease;
        }

        .badge-warning {
            background-color: #FFA500 !important;
            color: white;
        }

        .badge-alert {
            background-color: #FF6347 !important;
            color: white;
        }

        .badge-critical {
            background-color: #8B0000 !important;
            color: white;
        }

        .badge-default {
            background-color: #6c757d !important;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .charts-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container-main">
        <div class="header">
            <h1>🌍 미세먼지 경보 대시보드</h1>
            <p>한국환경공단 에어코리아 실시간 미세먼지 경보 발령 현황</p>
        </div>

        <!-- 로딩 표시 -->
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <h3>데이터를 불러오는 중...</h3>
            <p>미세먼지 경보 정보를 가져오고 있습니다.</p>
        </div>

        <!-- 에러 표시 -->
        <div id="error-alert" class="error-alert" style="display: none;">
            <span id="error-message"></span>
        </div>

        <!-- 통계 카드 -->
        <div id="stats-container" class="stats-container" style="display: none;">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-label">총 경보 발령</div>
                <div id="total-alerts" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📍</div>
                <div class="stat-label">영향 지역</div>
                <div id="unique-districts" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🗺️</div>
                <div class="stat-label">영향 권역</div>
                <div id="unique-regions" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚠️</div>
                <div class="stat-label">주요 단계</div>
                <div id="most-common-level" class="stat-value" style="font-size: 1.8rem;">N/A</div>
            </div>
        </div>

        <!-- 시각화 차트 -->
        <div id="charts-container" class="charts-container" style="display: none;">
            <div class="chart-card main-top10 main-chart">
                <h3>📊 지역별 경보 발령 현황 TOP 10</h3>
                <div id="chart1" style="height: 100%;"></div>
            </div>

            <div class="sub-charts-row">
                <div class="chart-card">
                    <h3>⚠️ 경보 단계별 분포</h3>
                    <div id="chart2" style="height: 100%;"></div>
                </div>

                <div class="chart-card">
                    <h3>🗺️ 권역별 경보 발령 현황</h3>
                    <div id="chart3" style="height: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- 상세 데이터 테이블 -->
        <div id="table-container" class="table-container" style="display: none;">
            <h3 style="margin-bottom: 20px; color: #333;">📋 상세 경보 발령 현황</h3>
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>🔢</th>
                        <th>지역</th>
                        <th>권역</th>
                        <th>경보 단계</th>
                        <th>발령일</th>
                        <th>해제일</th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                </tbody>
            </table>
        </div>

        <!-- 빈 상태 표시 -->
        <div id="empty-state" class="empty-state" style="display: none;">
            <h2>📭 데이터 없음</h2>
            <p>현재 발령된 미세먼지 경보가 없습니다.</p>
        </div>
    </div>

    <script>
        // API 키
        const API_KEY = '778d66dc3744f41da20fa88d135afa7c9dc2ddfa9ba7c96e49783a5e809ed33f';

        // 경보 수준 정규화 함수
        function normalizeLevel(levelName) {
            const levelMap = {
                '주의': 'warning',
                '경보': 'alert',
                '심각': 'critical'
            };
            return levelMap[levelName] || 'default';
        }

        // 통계 계산 함수
        function getStatistics(items) {
            if (!items || items.length === 0) {
                return {
                    totalAlerts: 0,
                    uniqueDistricts: 0,
                    uniqueRegions: 0,
                    mostCommonLevel: 'N/A'
                };
            }

            const districts = new Set();
            const regions = new Set();
            const levels = [];

            items.forEach(item => {
                if (item.districtName) districts.add(item.districtName);
                if (item.moveName) regions.add(item.moveName);
                if (item.issueGbn) levels.push(item.issueGbn);
            });

            // 가장 빈번한 경보 단계 계산
            const levelCounts = {};
            levels.forEach(level => {
                levelCounts[level] = (levelCounts[level] || 0) + 1;
            });

            let mostCommonLevel = 'N/A';
            let maxCount = 0;
            for (const [level, count] of Object.entries(levelCounts)) {
                if (count > maxCount) {
                    maxCount = count;
                    mostCommonLevel = level;
                }
            }

            return {
                totalAlerts: items.length,
                uniqueDistricts: districts.size,
                uniqueRegions: regions.size,
                mostCommonLevel: mostCommonLevel
            };
        }

        // 차트 생성 함수
        function createCharts(items) {
            if (!items || items.length === 0) return;

            // issueGbn_class 필드 추가
            items.forEach(item => {
                item.issueGbn_class = normalizeLevel(item.issueGbn || '');
            });

            // 1. 지역별 경보 현황 (막대 그래프)
            const districtCounts = {};
            items.forEach(item => {
                if (item.districtName) {
                    districtCounts[item.districtName] = (districtCounts[item.districtName] || 0) + 1;
                }
            });

            const top10Districts = Object.entries(districtCounts)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 10);

            const fig1 = {
                data: [{
                    x: top10Districts.map(([name]) => name),
                    y: top10Districts.map(([,count]) => count),
                    type: 'bar',
                    marker: {
                        color: top10Districts.map(([,count]) => count),
                        colorscale: 'Reds',
                        showscale: false
                    },
                    text: top10Districts.map(([,count]) => count),
                    textposition: 'outside',
                    textfont: {size: 14, color: '#333'}
                }],
                layout: {
                    title: '📊 지역별 경보 발령 현황 TOP 10',
                    titlefont: {size: 20},
                    xaxis: {
                        title: '지역 (Region)',
                        tickfont: {size: 12},
                        tickangle: -45
                    },
                    yaxis: {
                        title: '발령 횟수 (Alerts)',
                        tickfont: {size: 12}
                    },
                    hovermode: 'x unified',
                    showlegend: false,
                    plot_bgcolor: 'rgba(240,240,240,0.3)',
                    paper_bgcolor: 'white',
                    margin: {l: 60, r: 60, t: 80, b: 100},
                    height: 500
                }
            };
            Plotly.newPlot('chart1', fig1.data, fig1.layout, {responsive: true});

            // 2. 경보 레벨별 분포 (원형 그래프)
            const levelCounts = {};
            items.forEach(item => {
                if (item.issueGbn) {
                    levelCounts[item.issueGbn] = (levelCounts[item.issueGbn] || 0) + 1;
                }
            });

            const colors = {'주의': '#FFA500', '경보': '#FF6347', '심각': '#8B0000'};
            const fig2 = {
                data: [{
                    labels: Object.keys(levelCounts),
                    values: Object.values(levelCounts),
                    type: 'pie',
                    marker: {
                        colors: Object.keys(levelCounts).map(level => colors[level] || '#gray')
                    },
                    textinfo: 'label+percent',
                    textfont: {size: 12},
                    hole: 0.2,
                    domain: {x: [0, 0.55], y: [0, 1]}
                }],
                layout: {
                    title: '⚠️ 경보 단계별 분포',
                    titlefont: {size: 18},
                    hovermode: 'closest',
                    height: 500,
                    margin: {l: 20, r: 20, t: 80, b: 20},
                    legend: {x: 0.58, y: 0.5, orientation: 'v'}
                }
            };
            Plotly.newPlot('chart2', fig2.data, fig2.layout, {responsive: true});

            // 3. 권역별 경보 (수평 막대 그래프)
            const regionCounts = {};
            items.forEach(item => {
                if (item.moveName) {
                    regionCounts[item.moveName] = (regionCounts[item.moveName] || 0) + 1;
                }
            });

            const fig3 = {
                data: [{
                    y: Object.keys(regionCounts),
                    x: Object.values(regionCounts),
                    type: 'bar',
                    orientation: 'h',
                    marker: {color: 'steelblue'},
                    text: Object.values(regionCounts),
                    textposition: 'outside',
                    textfont: {size: 12, color: '#333'}
                }],
                layout: {
                    title: '🗺️ 권역별 경보 발령 현황',
                    titlefont: {size: 18},
                    xaxis: {
                        title: '발령 횟수 (Alerts)',
                        tickfont: {size: 11}
                    },
                    yaxis: {
                        title: '권역 (Region)',
                        tickfont: {size: 11}
                    },
                    hovermode: 'y unified',
                    showlegend: false,
                    plot_bgcolor: 'rgba(240,240,240,0.3)',
                    paper_bgcolor: 'white',
                    margin: {l: 150, r: 60, t: 60, b: 60},
                    height: 500
                }
            };
            Plotly.newPlot('chart3', fig3.data, fig3.layout, {responsive: true});
        }

        // 데이터 로드 및 표시 함수
        async function loadData() {
            try {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');

                const url = `http://apis.data.go.kr/B552584/UlfptcaAlarmInqireSvc/getUlfptcaAlarmInfo?serviceKey=${API_KEY}&returnType=json&numOfRows=100&pageNo=1&year=${year}&month=${month}`;

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`API 호출 실패: ${response.status}`);
                }

                const data = await response.json();
                const items = data.response?.body?.items || [];

                // 로딩 숨기기
                document.getElementById('loading').style.display = 'none';

                if (items.length === 0) {
                    document.getElementById('empty-state').style.display = 'block';
                    return;
                }

                // 통계 계산 및 표시
                const stats = getStatistics(items);
                document.getElementById('total-alerts').textContent = stats.totalAlerts;
                document.getElementById('unique-districts').textContent = stats.uniqueDistricts;
                document.getElementById('unique-regions').textContent = stats.uniqueRegions;
                document.getElementById('most-common-level').textContent = stats.mostCommonLevel;

                // 차트 생성
                createCharts(items);

                // 테이블 데이터 표시
                const tbody = document.getElementById('data-table-body');
                tbody.innerHTML = '';
                items.forEach((item, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${item.districtName || ''}</td>
                        <td>${item.moveName || ''}</td>
                        <td><span class="badge badge-${normalizeLevel(item.issueGbn || '')}">${item.issueGbn || ''}</span></td>
                        <td>${item.issueDate || ''}</td>
                        <td>${item.clearDate || '-'}</td>
                    `;
                    tbody.appendChild(row);
                });

                // 모든 컨테이너 표시
                document.getElementById('stats-container').style.display = 'grid';
                document.getElementById('charts-container').style.display = 'grid';
                document.getElementById('table-container').style.display = 'block';

            } catch (error) {
                console.error('데이터 로드 오류:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-alert').style.display = 'block';
                document.getElementById('error-message').textContent = `데이터를 불러오는데 실패했습니다: ${error.message}`;
            }
        }

        // 페이지 로드 시 데이터 로드
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
